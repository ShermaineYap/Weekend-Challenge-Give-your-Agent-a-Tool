AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Patience — give a Strands agent the ability to wait. EventBridge Scheduler
  re-invokes the agent (Lambda, or an SQS queue for a local worker) at a time the agent chooses.

Parameters:
  ModelId:
    Type: String
    Default: us.amazon.nova-pro-v1:0
  NotifyFrom:
    Type: String
    Default: ""
    Description: SES-verified sender address (leave empty to log notifications instead)
  NotifyTo:
    Type: String
    Default: ""
  WakeTarget:
    Type: String
    Default: lambda
    AllowedValues: [lambda, sqs]
    Description: Where wake-ups are delivered — the deployed Lambda, or an SQS queue for `python -m patience.worker`

Conditions:
  UseLambda: !Equals [!Ref WakeTarget, lambda]

Resources:
  DataBucket:
    Type: AWS::S3::Bucket

  WakeQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 86400

  ScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: !Sub patience-${AWS::StackName}

  # Role EventBridge Scheduler assumes to deliver a wake-up
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      Policies:
        - PolicyName: deliver-wakeups
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-wake
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt WakeQueue.Arn

  WakeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-wake
      CodeUri: .
      Handler: lambda_fn/handler.lambda_handler
      Runtime: python3.13
      Architectures: [arm64]
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          PATIENCE_MODEL_ID: !Ref ModelId
          PATIENCE_BUCKET: !Ref DataBucket
          PATIENCE_GROUP: !Ref ScheduleGroup
          PATIENCE_SCHEDULER_ROLE: !GetAtt SchedulerRole.Arn
          PATIENCE_TARGET_ARN: !If
            - UseLambda
            - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-wake
            - !GetAtt WakeQueue.Arn
          PATIENCE_NOTIFY_FROM: !Ref NotifyFrom
          PATIENCE_NOTIFY_TO: !Ref NotifyTo
      Policies:
        - S3ReadPolicy: { BucketName: !Ref DataBucket }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource: "*"
            - Effect: Allow
              Action: scheduler:CreateSchedule
              Resource: !Sub arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${ScheduleGroup}/*
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt SchedulerRole.Arn
            - Effect: Allow
              Action: ses:SendEmail
              Resource: "*"

Outputs:
  Bucket:
    Value: !Ref DataBucket
  ScheduleGroupName:
    Value: !Ref ScheduleGroup
  SchedulerRoleArn:
    Value: !GetAtt SchedulerRole.Arn
  WakeFunctionArn:
    Value: !GetAtt WakeFunction.Arn
  WakeQueueArn:
    Value: !GetAtt WakeQueue.Arn
  WakeQueueUrl:
    Value: !Ref WakeQueue
